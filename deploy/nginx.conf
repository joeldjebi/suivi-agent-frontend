# Site web, API et temps réel sur un seul port : le navigateur ne voit qu'une origine.
server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Compression : pages et scripts 3 à 4 fois plus légers sur réseau mobile.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Socket.IO : connexion permanente (WebSocket).
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Fichiers à télécharger (app Android) : dossier du serveur monté dans le conteneur.
  location /downloads/ {
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Fichiers du site versionnés par leur nom : mis en cache longtemps.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toutes les routes renvoient index.html.
  # Un add_header dans un location annule ceux du serveur : on les répète ici, et on pose
  # la CSP sur la page. CSP en Report-Only pour l'instant : elle N'EMPÊCHE RIEN, elle signale
  # seulement les violations dans la console du navigateur. À promouvoir en Content-Security-Policy
  # (en-tête sans « -Report-Only ») une fois vérifié que le site, la console éditeur et le
  # back-office ne remontent aucune violation.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
